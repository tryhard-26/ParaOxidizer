[package]
name = "paraoxidizer-cli"
version = "0.1.0"
edition = "2021"
authors = ["Adriteyo Das <das.adriteyo26@gmail.com>"]
description = "Command-line interface (pox) for ParaOxidizer"
license = "GPL-3.0-or-later"
repository = "https://github.com/tryhard-26/ParaOxidizer"
homepage = "https://github.com/tryhard-26/ParaOxidizer"

[dependencies]
paraoxidizer-core = { path = "../paraoxidizer-core", version = "0.1.0" }
paraoxidizer-format = { path = "../paraoxidizer-format", version = "0.1.0" }
paraoxidizer-quant = { path = "../paraoxidizer-quant", version = "0.1.0" }
paraoxidizer-calibration = { path = "../paraoxidizer-calibration", version = "0.1.0" }
paraoxidizer-optimizer = { path = "../paraoxidizer-optimizer", version = "0.1.0" }
paraoxidizer-security = { path = "../paraoxidizer-security", version = "0.1.0" }
paraoxidizer-runtime = { path = "../paraoxidizer-runtime", version = "0.1.0" }
paraoxidizer-serve = { path = "../paraoxidizer-serve", version = "0.1.0" }
paraoxidizer-bench = { path = "../paraoxidizer-bench", version = "0.1.0" }

clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
colored = "2.1"
comfy-table = "7.1"
tokio = { version = "1.39", features = ["full"] }
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
half = "2.4"
ratatui = "0.28"
crossterm = "0.28"
sysinfo = "0.31"
