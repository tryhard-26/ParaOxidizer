[package]
name = "paraoxidizer-core"
version = "0.1.0"
edition = "2021"
authors = ["Adriteyo Das <das.adriteyo26@gmail.com>"]
description = "Core types, architectures, hardware detection, and configuration for ParaOxidizer"
license = "GPL-3.0-or-later"
repository = "https://github.com/tryhard-26/ParaOxidizer"
homepage = "https://github.com/tryhard-26/ParaOxidizer"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
sysinfo = "0.31"
half = { version = "2.4", features = ["serde"] }
