[package]
name = "paraoxidizer-bench"
version = "0.1.1"
edition = "2021"
authors = ["Adriteyo Das <das.adriteyo26@gmail.com>"]
description = "Benchmarking suite for ParaOxidizer inference speed, latency percentiles, and memory"
license = "GPL-3.0-or-later"
repository = "https://github.com/tryhard-26/ParaOxidizer"
homepage = "https://github.com/tryhard-26/ParaOxidizer"

[dependencies]
paraoxidizer-core = { path = "../paraoxidizer-core", version = "0.1.1" }
paraoxidizer-runtime = { path = "../paraoxidizer-runtime", version = "0.1.1" }
paraoxidizer-format = { path = "../paraoxidizer-format", version = "0.1.1" }
paraoxidizer-quant = { path = "../paraoxidizer-quant", version = "0.1.1" }
paraoxidizer-calibration = { path = "../paraoxidizer-calibration", version = "0.1.1" }
paraoxidizer-security = { path = "../paraoxidizer-security", version = "0.1.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
comfy-table = "7.1"
colored = "2.1"
thiserror = "1.0"
half = { version = "2.4", features = ["serde"] }
tempfile = "3.10"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
ureq = "2.10"
memmap2 = "0.9"
safetensors = "0.4"

[[bin]]
name = "pox-bench"
path = "src/bin/pox_bench.rs"

[[bin]]
name = "bench-production-models"
path = "src/bin/bench_production_models.rs"

[[bin]]
name = "bench-full-model"
path = "src/bin/bench_full_model.rs"

[[bin]]
name = "bench-model-performance"
path = "src/bin/bench_model_performance.rs"


