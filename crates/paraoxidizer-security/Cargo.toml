[package]
name = "paraoxidizer-security"
version = "0.1.0"
edition = "2021"
authors = ["Adriteyo Das <das.adriteyo26@gmail.com>"]
description = "Supply-chain security, resource quotas, SHA-256 integrity, and Ed25519 digital signatures"
license = "GPL-3.0-or-later"
repository = "https://github.com/tryhard-26/ParaOxidizer"
homepage = "https://github.com/tryhard-26/ParaOxidizer"

[dependencies]
paraoxidizer-core = { path = "../paraoxidizer-core", version = "0.1.0" }
paraoxidizer-format = { path = "../paraoxidizer-format", version = "0.1.0" }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
